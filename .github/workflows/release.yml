# Publish jidoseal-mcp to PyPI when a version tag (v0.1.2, v0.1.3, ...) is pushed.
# Uses PyPI Trusted Publishing: PyPI trusts this workflow's short-lived OIDC identity, so no
# API token is stored anywhere. One-time setup on pypi.org: jidoseal-mcp → Manage → Publishing →
# add a GitHub publisher with owner "Jidoseal", repository "jidoseal-mcp", workflow
# "release.yml", environment "pypi".
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must name the version in pyproject.toml
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          python -c 'import json,sys; d=json.load(open("server.json")); v=sys.argv[1]; assert d["version"]==v and all(p["version"]==v for p in d["packages"]), "server.json version mismatch"' "${version}"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jidoseal-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
